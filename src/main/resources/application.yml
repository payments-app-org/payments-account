server:
  port: 8081

spring:
  application:
    name: account
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    # search_path соединения — своя схема, в том числе для нативных SQL-запросов
    hikari:
      schema: account
  # У каждого сервиса своя схема в общей базе (создаётся в infra/postgres/init.sql)
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: account
    liquibase-schema: account
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
  # Redis: блокировки планировщиков (ShedLock), кэш
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis — только для кэша и блокировок, репозитории Spring Data на нём не нужны
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: account
      # Кэш второго уровня: справочники лимитов (identification_limits, operation_limits, …) и лимиты счетов.
      # Балансы, счета и резервы не кэшируем.
      hibernate.cache.use_second_level_cache: true
      hibernate.cache.use_query_cache: true
      hibernate.cache.region.factory_class: jcache
      hibernate.javax.cache.provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
      hibernate.javax.cache.missing_cache_strategy: create

# Общая библиотека libs/platform
platform:
  time:
    zone: Europe/Moscow
  outbox:
    enabled: true
    publish-interval: 1s
    retention: 7d

messaging:
  account-reservations:
    topic: account.reservations
    partitions: 3
    replicas: 1

account:
  card:
    # Ключи только из окружения (в compose — из .env); без них сервис не стартует
    hmac-key: ${CARD_HMAC_KEY}
    encryption-key: ${CARD_ENCRYPTION_KEY}
    # Сколько карт других банков можно привязать
    max-linked: 5
  roundup:
    # Шаги «Округления на пользу», ₽ (совпадают с ограничением users_roundup_step_check)
    steps: [10, 100, 1000]
