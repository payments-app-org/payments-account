server:
  port: 8081

spring:
  application:
    name: account
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  # У каждого сервиса своя схема в общей базе
  flyway:
    schemas: account
    default-schema: account
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: account
